name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Not real secrets — an ephemeral CI database with no external exposure needs values that only
# satisfy config/env.ts's fail-fast startup validation (min length etc.), not actual security.
env:
  DATABASE_URL: postgresql://fitnesstracker:ci-password@localhost:5432/fitnesstracker
  JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret
  JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret
  SETUP_TOKEN: ci-setup-token-not-real
  RESET_TOKEN: ci-reset-token-not-real-either
  # Each E2E scenario registers and logs in its own account from the same IP; production keeps
  # the default of 5 per minute (backend/src/config/env.ts).
  AUTH_RATE_LIMIT_PER_MINUTE: "100"

jobs:
  # Runs on every push (any branch) and every PR — Lint, Typecheck, Unit Tests, Build.
  checks:
    name: Lint, Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Before the install: rejects commits that track node_modules/, dist/ or build/.
      - name: No dependencies or build output in Git
        run: pnpm run check:tracked

      - run: pnpm install --frozen-lockfile

      # Warning only (like Lighthouse in the other repos): an advisory without a fix available
      # (e.g. one that needs a major upgrade) must not block every push, but it shows up here.
      - name: Dependency audit (warning)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      # backend and frontend both import from @fitnesstracker/shared's build output, not its
      # source — same as every local dev script (see dev:backend/dev:frontend in package.json).
      - run: pnpm run build:shared

      # Typecheck/build/unit-tests below all import from @prisma/client's generated types (model
      # types, enums, ...) — reading prisma/schema.prisma and generating that client is a local
      # codegen step with no database connection needed, but nothing else in this job does it.
      - name: Generate Prisma client
        working-directory: backend
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: UI tokens (no raw colors / legacy palettes outside components/ui)
        run: pnpm run check:ui

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The production Caddyfile carries the cache and security headers (CSP, immutable assets).
      # A typo there would only show up at deploy time — validate it with the image prod runs.
      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  # Builds the two images production actually runs, the way deploy does. `checks` builds with the
  # workspace's own files, so a file the Dockerfile forgets to COPY (postcss.config.js once) only
  # failed at deploy: the app shipped without CSS. Nothing is pushed anywhere.
  docker-images:
    name: Production images (build + CSS check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend export (same command as deploy)
        run: docker build --target export -f frontend/Dockerfile --output frontend/dist .

      - name: Check the built CSS (Tailwind must have run)
        run: node scripts/check-frontend-css.mjs frontend/dist

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t fitnesstracker-backend:ci .

  # Backend integration tests (auth incl. refresh grace/password/reset/delete, data separation
  # between accounts, photo upload) against a real Postgres. TEST_DATABASE_URL is what switches
  # them on — without it `pnpm test` skips them (see backend/vitest.config.ts).
  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitnesstracker
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: fitnesstracker_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitnesstracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fitnesstracker:ci-password@localhost:5432/fitnesstracker_integration
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:shared

      - name: Generate Prisma client and apply migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm prisma:generate
          pnpm prisma:deploy

      - name: Integration tests
        working-directory: backend
        run: pnpm vitest run src/integration

  # Only on PRs — brings up a real Postgres + backend and runs the offline-sync Playwright suite
  # (frontend/e2e/) against a production build, covering integration, E2E and offline-sync
  # testing in one (there's no separate integration suite; the E2E tests exercise the real API
  # end to end already). This is the "Build Verification" step too, since the suite's webServer
  # builds the frontend before serving it.
  e2e:
    name: Playwright E2E (offline-sync)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitnesstracker
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: fitnesstracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitnesstracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:shared

      - name: Apply migrations + seed the exercise catalog
        working-directory: backend
        run: |
          pnpm prisma:generate
          pnpm prisma:deploy
          pnpm prisma:seed

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the backend
        working-directory: backend
        run: |
          pnpm build
          nohup node dist/server.js > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "Backend never became healthy" >&2
          exit 1

      - name: Run the offline-sync E2E suite
        working-directory: frontend
        run: pnpm test:e2e

      - name: Backend log (on failure)
        if: failure()
        run: cat backend/backend.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  # Roadmap 4.6 — Lighthouse (Performance, Accessibility, Best Practices) gegen den Produktions-
  # Build der Login-Seite. Bewusst nur Warnung (continue-on-error + ::warning::), damit Regressionen
  # sichtbar werden, ohne PRs wegen Messschwankungen zu blockieren. Lighthouse 12 hat keine
  # PWA-Kategorie mehr; Installierbarkeit prüft frontend/e2e/pwa-install.spec.ts.
  lighthouse:
    name: Lighthouse (Warnung, blockiert nicht)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:shared

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Serve the production build
        working-directory: frontend
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/login > /dev/null && exit 0
            sleep 1
          done
          echo "Preview never became ready" >&2
          cat preview.log >&2
          exit 1

      - name: Run Lighthouse
        run: |
          mkdir -p lighthouse
          npx --yes lighthouse@12.6.1 http://127.0.0.1:4173/login \
            --only-categories=performance,accessibility,best-practices \
            --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output=html --output-path=lighthouse/report

      - name: Scores and thresholds
        run: |
          node -e '
            const r = require("./lighthouse/report.report.json");
            const min = { performance: 80, accessibility: 95, "best-practices": 90 };
            for (const [id, c] of Object.entries(r.categories)) {
              const score = Math.round(c.score * 100);
              console.log(`${c.title}: ${score}`);
              if (score < min[id]) {
                console.log(`::warning title=Lighthouse::${c.title} ${score} liegt unter ${min[id]}`);
              }
            }
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse/
          retention-days: 14
