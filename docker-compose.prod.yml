# Mini-PC deployment behind a shared Cloudflare Tunnel (this box runs several PWAs, so no
# single app owns host ports 80/443 — see README.md). Build the frontend once
# (`docker build --target export -f frontend/Dockerfile --output frontend/dist .`) before
# `docker compose -f docker-compose.prod.yml up -d --build`. Caddy publishes nothing to the
# host; it's only reachable from the shared `edge` network, where the `cloudflared` container
# (managed separately, outside this repo — see README.md) routes
# `${DOMAIN}` to it by container name — and `${NUTRITION_DOMAIN}` (the Kalorientracker) to
# `fitnesstracker-caddy:8080`.
#
# The Kalorientracker (github.com/kniepertsebastian-spec/kalorientracker) shares this backend,
# database and login. Its PWA (`nutrition-frontend`) and the BullMQ `worker` are built from that
# repository, checked out next to this one (KALORIENTRACKER_DIR, default ../kalorientracker).
services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      NODE_ENV: production
      # Cookies must be Secure once served over HTTPS (Caddy terminates TLS in front of this).
      COOKIE_SECURE: "true"
      FRONTEND_ORIGIN: https://${DOMAIN:?}
      # Cloudflare -> cloudflared -> Caddy -> backend: all hops are on private addresses (see the
      # trusted_proxies block in Caddyfile). Without this every visitor shares one rate-limit bucket.
      TRUST_PROXY: "loopback,linklocal,uniquelocal"
      # `sharp` (progress-photo processing) bundles a precompiled libvips binary whose SIMD-
      # vectorized codepaths can assume CPU instructions (AVX2) that lower-power hardware —
      # exactly the kind of CPU a mini-PC like this one tends to have — doesn't support. Without
      # this, that mismatch surfaces as a SIGILL that kills the whole container outright (not a
      # catchable JS error) the moment libvips initializes; this env var forces libvips onto its
      # universally-compatible non-vectorized path instead. The app also no longer imports sharp
      # until a photo is actually uploaded (see progressPhoto.service.ts), so even if this box's
      # CPU still can't run it, that failure now stays contained to the upload request instead of
      # crash-looping the entire backend on every boot.
      VIPS_NOVECTOR: "1"
      # Cookie SSO: the refresh cookie is scoped to this parent domain (e.g. pwa-tree.de), so a login
      # in one PWA also signs in the other. Empty = host-only cookie, as before.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: ./media
    volumes:
      # Progress-photo uploads live on the VPS filesystem (no cloud storage, see
      # ARCHITECTURE.md) and must survive container recreation, same as pgdata below.
      - uploads:/app/backend/uploads
      # Nutrition photos, cookbook pages and temporary videos; shared with the worker, which
      # sweeps the tmp/ folder (see backend/src/lib/media.ts).
      - media:/app/backend/media
    # Ready once the API answers and can reach the database (/api/health runs SELECT 1). The long
    # start period covers `prisma generate` + migrations that run before the server boots.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Job queues (BullMQ), the shared rate-limit store and the daily AI budgets. AOF persistence so
  # queued jobs survive a restart; `noeviction` because BullMQ must never lose keys to an eviction.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # BullMQ worker of the Kalorientracker: AI jobs (Roadmap 04; yt-dlp for recipe videos is
  # preinstalled) and the hourly cleanup of temporary media.
  worker:
    build:
      context: ${KALORIENTRACKER_DIR:-../kalorientracker}/worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /data/media
      MEDIA_TMP_TTL_HOURS: ${MEDIA_TMP_TTL_HOURS:-24}
    volumes:
      - media:/data/media
    depends_on:
      redis:
        condition: service_healthy

  # The Kalorientracker PWA: static build served by its own small Caddy, which sets the cache
  # headers. Reached only through fitnesstracker-caddy (:8080), which adds the security headers and
  # routes /api to the shared backend.
  nutrition-frontend:
    build:
      context: ${KALORIENTRACKER_DIR:-../kalorientracker}/nutrition-frontend
    restart: unless-stopped


  caddy:
    image: caddy:2.11-alpine
    container_name: fitnesstracker-caddy
    restart: unless-stopped
    # No `ports:` — not published to the host. Reached only via the `edge` network by
    # the shared cloudflared tunnel, using the container name above.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    depends_on:
      - backend
      - nutrition-frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uploads:
  media:
  redisdata:

networks:
  default:
  edge:
    external: true
