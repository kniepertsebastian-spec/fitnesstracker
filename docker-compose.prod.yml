# VPS deployment. Build the frontend once (`docker build --target export -f frontend/Dockerfile
# --output frontend/dist .`) before `docker compose -f docker-compose.prod.yml up -d` — Caddy
# serves that directory directly. Only Caddy's 80/443 are published to the host.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      NODE_ENV: production
      # Cookies must be Secure once served over HTTPS (Caddy terminates TLS in front of this).
      COOKIE_SECURE: "true"
      FRONTEND_ORIGIN: https://${DOMAIN:?}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?}
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
